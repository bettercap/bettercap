name: Windows tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
        matrix:
          os: [windows-latest]
          go-version: ['1.27.x']

    steps:
        - name: Checkout Code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Set up Go
          uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
          with:
            go-version: ${{ matrix.go-version }}

        - name: Install libusb via mingw
          uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
          with:
            install: |-
              mingw64/mingw-w64-x86_64-libusb
              mingw64/mingw-w64-x86_64-pkg-config

        - name: Install other dependencies
          run: |
            choco install openssl.light -y
            choco install make -y
            choco install 7zip -y
            choco install zadig -y
            curl -L "https://www.winpcap.org/install/bin/WpdPack_4_1_2.zip" -o "C:\wpcap-sdk.zip"
            7z x -y "C:\wpcap-sdk.zip" -o"C:\winpcap"

        - run: echo "D:\a\_temp\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        - name: Run Tests
          run: env GO111MODULE=on make test
